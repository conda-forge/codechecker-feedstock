schema_version: 1

context:
  version: "6.29.3"

package:
  name: codechecker
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/codechecker/codechecker-${{ version }}.tar.gz
  sha256: 13a01fd7250ebf107af9c3f338745654c5efe0320c3db9e5f8744d4db0510b02

build:
  number: 0
  skip: match(python, '<3.9')
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - CodeChecker = codechecker_common.cli:main
      - merge-clang-extdef-mappings = codechecker_merge_clang_extdef_mappings.cli:main
      - post-process-stats = codechecker_statistics_collector.cli:main
      - report-converter = codechecker_report_converter.cli:main
      - tu_collector = tu_collector.tu_collector:main

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - ${{ stdlib('c') }}
  host:
    - python
    - pip
    - setuptools >=80,<81
  run:
    - python
    - alembic >=1.5,<2
    - argcomplete >=3,<4
    - authlib >=1.6,<2
    - gitpython >=3,<4
    - lxml >=6,<7
    - multiprocess >=0.70,<1
    - portalocker >=3,<4
    - prettytable >=3,<4
    - psutil >=7,<8
    - pyyaml >=6,<7
    - requests >=2,<3
    - sarif-tools >=3,<4
    - semver >=3,<4
    - setuptools >=80,<81
    - sqlalchemy >=2,<3
    - thrift >=0.22,<1
    - types-lxml >=2026.2,<2026.3
    - types-psutil >=7,<8
    - types-pyyaml >=6,<7
    - types-setuptools >=80,<81

tests:
  - python:
      imports:
        - codechecker_analyzer
        - codechecker_client
        - codechecker_common
        - codechecker_server
      pip_check: true
  - script:
      - CodeChecker --help
      - merge-clang-extdef-mappings --help
      - post-process-stats --help
      - report-converter --help
      - tu_collector --help

about:
  license: Apache-2.0 WITH LLVM-exception
  license_file: LICENSE.TXT
  summary: CodeChecker is an analyzer tooling, defect database and viewer extension
  homepage: https://github.com/Ericsson/CodeChecker

extra:
  recipe-maintainers:
    - mwittgen
